name: Docker Build & Push to Docker Hub

on:
  push:
    branches: 
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push Image on Local Infrastructure V2
    runs-on: self-hosted  # 🚀 O Runner Global da Organização vai assumir aqui!

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 🚀 SOLUÇÃO DEFINITIVA: Vincula o instalador guardado no seu host físico 
      # para dentro do workspace temporário do runner ANTES do build começar.
      # Usamos uma variável de ambiente do próprio runner para manter a portabilidade!
      - name: Resgatar Instalador Local no Workspace
        run: |
          cp ../../license.tar.gz . 2>/dev/null || cp "${{ github.workspace }}/../license.tar.gz" . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-license/license.tar.gz .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            rodrigomicrosiga/license-dev:3.7.1
            rodrigomicrosiga/license-dev:latest