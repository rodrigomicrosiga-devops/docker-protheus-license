name: Docker Build & Push to Docker Hub

on:
  push:
    branches: 
      - develop
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-push:
    name: Build and Push Image on Local Infrastructure V2
    runs-on: self-hosted  # 🚀 O Runner Global da Organização vai assumir aqui!

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 🚀 SOLUÇÃO DEFINITIVA: Vincula o instalador guardado no seu host físico 
      # para dentro do workspace temporário do runner ANTES do build começar.
      # Usamos curingas de extensão para aceitar qualquer nome de instalador (.tar.gz / .TAR.GZ)
      - name: Resgatar Instalador Local no Workspace
        run: |
          cp ../../*.[tT][aA][rR].[gG][zZ] . 2>/dev/null || cp "${{ github.workspace }}/../"*.[tT][aA][rR].[gG][zZ] . 2>/dev/null || cp /media/rodrigo/dados/docker-protheus-license/*.[tT][aA][rR].[gG][zZ] .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: rodrigomicrosiga/license-dev:3.7.1  # 🎯 Alterado: Apenas a tag imutável ativa